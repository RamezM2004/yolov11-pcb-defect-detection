# YOLO11s + P2 + Coordinate Attention in backbone and neck/head
# Detects at P2, P3, P4, P5
# CA inserted twice:
# 1) backbone feature refinement
# 2) neck/head feature refinement before Detect

nc: 9

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

scale: s

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2-P2/4
  - [-1, 1, CoordAtt, [256]]            # 3-CA P2 backbone

  - [-1, 1, Conv, [256, 3, 2]]          # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 5-P3/8
  - [-1, 1, CoordAtt, [512]]            # 6-CA P3 backbone

  - [-1, 1, Conv, [512, 3, 2]]          # 7-P4/16
  - [-1, 2, C3k2, [512, True]]          # 8-P4/16
  - [-1, 1, CoordAtt, [512]]            # 9-CA P4 backbone

  - [-1, 1, Conv, [1024, 3, 2]]         # 10-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 11-P5/32
  - [-1, 1, SPPF, [1024, 5]]            # 12
  - [-1, 2, C2PSA, [1024]]              # 13
  - [-1, 1, CoordAtt, [1024]]           # 14-CA P5 backbone

head:
  # P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]           # concat backbone P4 CA
  - [-1, 2, C3k2, [512, False]]         # 17

  # P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]           # concat backbone P3 CA
  - [-1, 2, C3k2, [256, False]]         # 20-P3/8

  # P3 -> P2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]           # concat backbone P2 CA
  - [-1, 2, C3k2, [128, False]]         # 23-P2/4

  # P2 -> P3
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 20], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]         # 26-P3/8

  # P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]         # 29-P4/16

  # P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]         # 32-P5/32

  # CA again in neck/head before Detect
  - [23, 1, CoordAtt, [128]]            # 33-P2/4 neck CA
  - [26, 1, CoordAtt, [256]]            # 34-P3/8 neck CA
  - [29, 1, CoordAtt, [512]]            # 35-P4/16 neck CA
  - [32, 1, CoordAtt, [1024]]           # 36-P5/32 neck CA

  - [[33, 34, 35, 36], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)