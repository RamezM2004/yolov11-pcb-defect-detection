# YOLO11s + P2 + Coordinate Attention once
# CA is added only before final Detect heads
# Detects at P2, P3, P4, P5

nc: 9

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

scale: s

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2-P2/4

  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4-P3/8

  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, C3k2, [512, True]]         # 6-P4/16

  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]        # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 2, C2PSA, [1024]]             # 10

# Head with P2 + CA once
head:
  # P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]          # concat backbone P4
  - [-1, 2, C3k2, [512, False]]        # 13

  # P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]          # concat backbone P3
  - [-1, 2, C3k2, [256, False]]        # 16-P3/8

  # P3 -> P2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]          # concat backbone P2
  - [-1, 2, C3k2, [128, False]]        # 19-P2/4

  # P2 -> P3
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]        # 22-P3/8

  # P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]        # 25-P4/16

  # P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]        # 28-P5/32

  # Coordinate Attention once before final Detect
  - [19, 1, CoordAtt, [128]]           # 29-P2/4
  - [22, 1, CoordAtt, [256]]           # 30-P3/8
  - [25, 1, CoordAtt, [512]]           # 31-P4/16
  - [28, 1, CoordAtt, [1024]]          # 32-P5/32

  # Detect on P2, P3, P4, P5
  - [[29, 30, 31, 32], 1, Detect, [nc]]